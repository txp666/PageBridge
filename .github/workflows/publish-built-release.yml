name: Publish an existing verified build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.7.3)
        required: true
        type: string
      run_id:
        description: Original release run containing the completed platform build artifacts
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'txp666/PageBridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_REF: ${{ inputs.tag }}
      WORKFLOW_COMMIT: ${{ github.sha }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    defaults:
      run:
        working-directory: source
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Bind the original build run to the immutable release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release-ci.py identity --output validation/release/identity.json
          python3 - <<'PY'
          import json, os, subprocess
          run_id = os.environ['BUILD_RUN_ID']
          assert run_id.isdecimal(), 'Invalid build run ID'
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/txp666/PageBridge/actions/runs/{run_id}']))
          identity = json.load(open('validation/release/identity.json'))
          assert run['head_sha'] == identity['sourceCommit'], 'Build run belongs to another source commit'
          assert run['path'] == '.github/workflows/release.yml', 'Expected the standard release workflow'
          assert run['event'] in ('push', 'workflow_dispatch'), 'Expected a maintainer release build'
          assert run['status'] == 'completed', 'Stop the original release run before resuming publication'
          PY
      - name: Reuse the completed Mac, Windows and source build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: release-assets-*-${{ inputs.run_id }}
          merge-multiple: true
          path: source/dist
          digest-mismatch: error
      - name: Install pinned publishing dependencies
        run: |
          python3 scripts/release-ci.py requirements --output /tmp/pagebridge-verification.txt
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r /tmp/pagebridge-verification.txt
          python3 -m pip install --require-hashes --only-binary=:all: -r scripts/cos-requirements.txt
      - name: Sign the Windows manifests and recheck the original build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 scripts/windows-update.py
          python3 scripts/windows-update.py --cos
          python3 scripts/verify-release.py --check-latest --output validation/release/assets.json --notes-output validation/release/notes.md
      - name: Stage and verify COS objects with bounded parallel transfers
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        run: python3 ../automation/scripts/cos-release.py stage --dist dist --report validation/release/assets.json --pointer validation/release/cos-pointer.json
      - name: Publish the original verified application packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release-ci.py publish
      - name: Activate the verified COS release and retain only the latest version
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        run: python3 ../automation/scripts/cos-release.py activate --pointer validation/release/cos-pointer.json
      - name: Verify public release metadata and signed update feeds without a second COS full download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ../automation/scripts/verify-release.py --source-root . --dist dist --published --require-latest --cos-staged --output validation/release/published.json
      - name: Save publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-resumed-${{ github.run_id }}
          path: source/validation/release/*.json
          retention-days: 30
