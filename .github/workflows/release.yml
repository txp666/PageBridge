name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

# Serialize all versions so two tags cannot race to replace the latest feed.
concurrency:
  group: public-macos-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'txp666/PageBridge'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CLANG_MODULE_CACHE_PATH: /tmp/pagebridge-clang-cache
      SWIFT_MODULECACHE_PATH: /tmp/pagebridge-swift-cache
      RELEASE_REF: ${{ inputs.tag || github.ref }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate tag and release identity
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(uname -m)" = arm64
          mkdir -p validation/release
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          release = json.loads(Path('VERSION.json').read_text())
          config = json.loads(Path('update-config.json').read_text())
          version, build = release['version'], str(release['build'])
          assert re.fullmatch(r'\d+\.\d+\.\d+', version) and build.isdecimal() and int(build) > 0
          ref = os.environ['RELEASE_REF']
          tag = ref.removeprefix('refs/tags/')
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Release ref must be a version tag'
          assert tag == 'v' + version, 'Tag must exactly match VERSION.json'
          assert config['repository'] == os.environ['GITHUB_REPOSITORY'] == 'txp666/PageBridge'
          tag_commit = subprocess.check_output(['git','rev-parse','refs/tags/'+tag+'^{commit}'], text=True).strip()
          assert tag_commit == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          # REST /releases/tags/{tag} does not find unpublished drafts. gh's
          # draft-aware lookup gives the stable release ID endpoint instead.
          found = subprocess.run(['gh','release','view',tag,'--repo',config['repository'],'--json','apiUrl'], capture_output=True, text=True)
          if found.returncode:
              assert 'release not found' in found.stderr.lower(), 'Release lookup failed: ' + found.stderr
          else:
              api_url = json.loads(found.stdout)['apiUrl']
              existing = json.loads(subprocess.check_output(['gh','api',api_url], text=True))
              assert existing['draft'], 'Refusing to overwrite a published release. Publish a new version instead.'
              assert existing['tag_name'] == tag, 'Draft tag differs'
              marker = '<!-- pagebridge-source:' + tag_commit + ' -->'
              assert existing['target_commitish'] == tag_commit and marker in existing['body'], 'Draft does not belong to this workflow and commit'
          identity = dict(tag=tag, sourceCommit=tag_commit, workflowCommit=os.environ['WORKFLOW_COMMIT'], event=os.environ['GITHUB_EVENT_NAME'])
          Path('validation/release/identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          print(json.dumps(identity))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nbuild={build}\ntag={tag}\n')
          PY
      - name: Install pinned uv bootstrap
        run: python3 -m pip install --target engine/.tools uv==0.9.17
      - name: Check signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          if not os.environ.get('SPARKLE_PRIVATE_KEY','').strip():
              raise SystemExit('Set the SPARKLE_PRIVATE_KEY repository secret before publishing.')
          PY
      - name: Install locked translation engine
        run: bash engine/setup.sh 2>&1 | tee validation/release/engine-setup.log
      - name: Test Swift application
        run: swift test --package-path macOS --cache-path /tmp/pagebridge-spm-cache --disable-sandbox 2>&1 | tee validation/release/swift-tests.log
      - name: Test engine and release tooling
        run: |
          engine/.venv/bin/python -B -m unittest discover -s engine/tests -v 2>&1 | tee validation/release/engine-tests.log
          engine/.venv/bin/python -B -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee validation/release/release-tests.log
      - name: Build native application and verify bundle
        run: |
          bash scripts/build-app.sh 2>&1 | tee validation/release/build.log
          python3 scripts/verify-bundle.py --output validation/release/bundle.json
      - name: Package application and corresponding sources
        run: |
          python3 scripts/package-release.py
          python3 scripts/fetch-third-party-sources.py
      - name: Sign and verify OTA feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: engine/.venv/bin/python scripts/create-appcast.py
      - name: Verify complete release and increasing build number
        run: |
          engine/.venv/bin/python scripts/verify-release.py --check-latest --output validation/release/assets.json --notes-output validation/release/notes.md
          ditto -x -k "dist/PageBridge-${{ steps.identity.outputs.version }}-macOS-arm64.zip" validation/release/unpacked
          python3 scripts/verify-bundle.py --app validation/release/unpacked/PageBridge.app --output validation/release/unpacked-bundle.json
      - name: Create draft, verify uploaded assets, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          tag, version = os.environ['RELEASE_TAG'], os.environ['RELEASE_VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          # Check the tag still resolves to the commit that was built.
          refs = subprocess.check_output(['git','ls-remote','origin','refs/tags/'+tag,'refs/tags/'+tag+'^{}'], text=True)
          mapping = {line.split()[1]:line.split()[0] for line in refs.splitlines()}
          remote = mapping.get('refs/tags/'+tag+'^{}', mapping.get('refs/tags/'+tag))
          commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert remote == commit, 'Remote tag changed during build'
          report = json.loads(Path('validation/release/assets.json').read_text())
          assets = [str(Path('dist')/item['name']) for item in report['assets']]
          marker = '<!-- pagebridge-source:' + commit + ' -->'
          notes = Path('validation/release/notes.md')
          notes.write_text(notes.read_text() + '\n' + marker + '\n')
          found = subprocess.run(['gh','release','view',tag,'--repo',repo,'--json','apiUrl'], capture_output=True, text=True)
          if found.returncode == 0:
              api_url = json.loads(found.stdout)['apiUrl']
              existing = json.loads(subprocess.check_output(['gh','api',api_url], text=True))
              assert existing['draft'] and existing['tag_name'] == tag and existing['target_commitish'] == commit and marker in existing['body'], 'Refusing to modify an unrelated or published release'
              subprocess.run(['gh','release','upload',tag,'--repo',repo,'--clobber',*assets], check=True)
              subprocess.run(['gh','release','edit',tag,'--repo',repo,'--title','PageBridge '+version,'--notes-file',str(notes)], check=True)
          else:
              assert 'release not found' in found.stderr.lower(), 'Release lookup failed: ' + found.stderr
              # Create fails safely if a release appeared since the identity check.
              subprocess.run(['gh','release','create',tag,'--repo',repo,'--verify-tag','--draft','--target',commit,
                              '--title','PageBridge '+version,'--notes-file',str(notes),*assets], check=True)
              api_url = json.loads(subprocess.check_output(['gh','release','view',tag,'--repo',repo,'--json','apiUrl'], text=True))['apiUrl']
          # A failed upload leaves a draft, never a partially populated public feed.
          metadata = json.loads(subprocess.check_output(['gh','api',api_url], text=True))
          assert metadata['draft'] and not metadata['prerelease']
          uploaded = {item['name']:item for item in metadata['assets']}
          assert set(uploaded) == {item['name'] for item in report['assets']}
          for expected in report['assets']:
              actual = uploaded[expected['name']]
              assert actual['size'] == expected['bytes'] and actual['state'] == 'uploaded', 'Uploaded asset size/state differs'
              assert actual.get('digest') == 'sha256:' + expected['sha256'], 'Uploaded asset SHA-256 differs'
          subprocess.run(['gh','release','edit',tag,'--repo',repo,'--draft=false','--latest'], check=True)
          PY
      - name: Verify public downloads and latest OTA feed
        run: engine/.venv/bin/python scripts/verify-release.py --published --output validation/release/published.json
      - name: Upload release validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-${{ github.run_id }}
          path: |
            validation/release/*.log
            validation/release/*.json
          if-no-files-found: ignore
          retention-days: 30

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}
