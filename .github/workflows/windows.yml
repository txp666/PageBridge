name: Windows build and test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'windows/**'
      - 'desktop/**'
      - 'engine/**'
      - 'scripts/*windows*'
      - 'scripts/windows_package.py'
      - 'scripts/setup-inno.ps1'
      - 'scripts/bundle-profile.json'
      - 'docs/WINDOWS.md'
      - 'VERSION.json'
      - 'THIRD_PARTY_NOTICES.md'
      - 'demos/**'
      - 'assets/PageBridge-icon.png'
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'desktop/**'
      - 'engine/**'
      - 'scripts/*windows*'
      - 'scripts/windows_package.py'
      - 'scripts/setup-inno.ps1'
      - 'scripts/bundle-profile.json'
      - 'docs/WINDOWS.md'
      - 'VERSION.json'
      - 'THIRD_PARTY_NOTICES.md'
      - 'demos/**'
      - 'assets/PageBridge-icon.png'
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes for package verification
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Install locked x64 engine
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path validation/windows -Force | Out-Null
          & engine/setup-windows.ps1 *> validation/windows/setup.log
      - name: Install the hash-pinned official Inno Setup compiler
        run: |
          $Iscc = & scripts/setup-inno.ps1
          if (!(Test-Path -LiteralPath $Iscc -PathType Leaf)) { throw 'Inno Setup compiler is missing.' }
          "PAGEBRIDGE_ISCC=$Iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test worker and desktop backend
        run: |
          & engine/.venv/Scripts/python.exe -B -m unittest discover -s engine/tests -v *> validation/windows/engine-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Engine tests failed.' }
          $env:PYTHONPATH = Join-Path $PWD 'desktop'
          & engine/.venv/Scripts/python.exe -B -m unittest discover -s desktop/tests -v *> validation/windows/desktop-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed.' }
          Remove-Item Env:PYTHONPATH
          & engine/.venv/Scripts/python.exe -B -m unittest discover -s scripts -p 'test_windows*.py' -v *> validation/windows/packaging-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Packaging boundary tests failed.' }
      - name: Compile WinUI, package ZIP and compile Setup.exe with Inno Setup
        run: |
          & scripts/build-windows.ps1 -SkipEngineSetup *> validation/windows/build.log
      - name: Verify install, installed files, private engine and uninstall
        run: |
          $Version = (Get-Content VERSION.json -Raw | ConvertFrom-Json).version
          $Package = "PageBridge-$Version-windows-x64"
          & scripts/test-windows-installer.ps1 -Installer "dist/$Package-setup.exe" -PackageDirectory "dist/$Package" -Output validation/windows/installer.json *> validation/windows/installer-test.log
      - name: Upload unsigned Windows app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PageBridge-windows-x64-${{ github.run_id }}
          path: |
            dist/PageBridge-*-windows-x64.zip
            dist/PageBridge-*-windows-x64.zip.sha256
            dist/PageBridge-*-windows-x64-setup.exe
            dist/PageBridge-*-windows-x64-setup.exe.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation-${{ github.run_id }}
          path: |
            validation/windows/*.json
            validation/windows/*.log
          if-no-files-found: ignore
          retention-days: 14
