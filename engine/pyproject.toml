[project]
name = "pagebridge-engine"
version = "0.1.0"
description = "Private PageBridge worker using the official pdf2zh-next Python API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pdf2zh-next==2.9.0",
  "babeldoc==0.6.2",
  "pymupdf==1.25.2",
  "httpx==0.28.1",
  # BabelDOC uses BitStream, removed by the incompatible bitstring 5 major.
  "bitstring==4.3.0",
]

[tool.uv]
package = false
